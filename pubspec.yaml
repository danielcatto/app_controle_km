name: controle_km
description: 'App para controle de km'
publish_to: 'daniel catto'
version: 1.0.0+1
environment:
  sdk: '>=2.18.0 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  go_router: ^7.0.0
  sqflite: ^2.4.3
  path: ^1.9.1
  path_provider: ^2.0.15
  geolocator: ^14.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.9.0
  flutter_launcher_icons: "^0.13.1" # A versão pode variar

flutter_launcher_icons:
  android: "launcher_icon"
  #ios: true
  image_path: "assets/images/logo.png" # Caminho para a sua imagem recortada

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.jpg
    - assets/images/background.jpg
